<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Sign In | TCMS</title>
  <link rel="stylesheet" href="./css/styles.css">
  <script src="./js/ui.js"></script>
  <script type="module" src="./js/app.js"></script>
</head>
<body data-page="login">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header><p>TCMS</p><p>Tzu Chi Mozambique System</p></header>
  <main id="main-content" tabindex="-1">
    <h1>Sign in to TCMS</h1>
    <p>Use your account to access your workspace.</p>
    <p id="auth-status" role="status" aria-live="polite">Connecting to TCMS…</p>
    <form id="sign-in-form" method="post" aria-describedby="auth-status">
      <fieldset disabled>
        <legend>Account credentials</legend>
        <p><label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="username"
            autocapitalize="none" spellcheck="false" required></p>
        <p><label for="password">Password</label>
          <input id="password" name="password" type="password"
            autocomplete="current-password" required></p>
        <button type="submit">Sign in</button>
      </fieldset>
    </form>
    <p id="register-link"><a href="./register.html">Request an account</a></p>
    <div id="session-actions" hidden>
      <button id="check-access" type="button">Check access</button>
      <button id="sign-out" type="button">Sign out</button>
    </div>
    <noscript>Enable JavaScript to sign in.</noscript>
  </main>
  <footer><p>TCMS · Tzu Chi Mozambique System</p></footer>
</body>
</html>
