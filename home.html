<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Home | TCMS</title>
  <link rel="stylesheet" href="./css/styles.css">
  <script src="./js/ui.js"></script>
  <script type="module" src="./js/app.js"></script>
</head>
<body data-page="home">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <header><p>TCMS</p><p>Tzu Chi Mozambique System</p></header>
  <main id="main-content" tabindex="-1">
    <p id="auth-status" role="status" aria-live="polite">Checking access…</p>
    <!-- No user data is included in the static HTML. Backend checks remain mandatory. -->
    <section id="workspace" hidden aria-labelledby="home-title">
      <p class="eyebrow">YOUR WORKSPACE</p>
      <h1 id="home-title">Where would you like to work today?</h1>
      <p class="page-intro">One shared platform for Tzu Chi Mozambique. Choose a module to get started.</p>
      <p id="account-summary"></p>
      <div class="section-heading"><h2>Your modules</h2><span>Access tailored to your account</span></div>
      <div id="module-content" class="module-grid"></div>
    </section>
    <div id="session-actions" hidden>
      <button id="check-access" type="button">Check access</button>
      <button id="sign-out" type="button">Sign out</button>
    </div>
    <noscript>Enable JavaScript to verify your access.</noscript>
  </main>
  <footer><p>TCMS · Tzu Chi Mozambique System</p></footer>
</body>
</html>
