<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer">
<title>TCM Item Movement System</title>
<link rel="stylesheet" href="./css/item-movement-original.css?v=20261111-original">
<link rel="stylesheet" href="./css/item-movement-portal.css?v=20261111-original">
<script src="./js/ui.js?v=20261111-original"></script><script type="module" src="./js/app.js?v=20261111-original"></script>
</head><body data-page="logistics"><div class="container">
<header class="integration-header"><a href="./home.html">Back to home</a><p id="account-summary"></p></header>
<main id="main-content"><p id="auth-status" role="status" aria-live="polite">Checking access…</p>
<section id="workspace" hidden><div id="module-content"></div></section>
<div id="session-actions" hidden><button id="check-access" type="button">Check access</button><button id="sign-out" type="button">Sign out</button></div>
<noscript>Enable JavaScript to verify your access.</noscript></main></div>
<template id="original-dashboard">    <!-- MAIN DASHBOARD SECTION -->
    <div id="dashboard-section">
      <div class="header-bar">
        <div>
          <h1 style="display: inline-block;">Item Movement & Inventory System</h1>
          <span id="user-role-display" class="role-badge">Loading Role...</span>
        </div>
        <button id="logout-btn" style="background-color: var(--danger);">Sign Out</button>
      </div>

      <!-- Administrator Access Management (Level 4 Only) -->
      <div id="admin-panel" class="card hidden" style="border: 2px solid #4f46e5;">
        <h2>Access Management (Administrator Only)</h2>
        <form id="assign-role-form" style="display: flex; gap: 1rem; align-items: flex-end; margin-bottom: 1rem;">
          <div style="flex: 1;">
            <label for="target-user">Portal account:</label>
            <select id="target-user" required></select>
          </div>
          <div style="flex: 1;">
            <label for="target-role">Role:</label>
            <select id="target-role" required>
              <option value="VIEWER">Viewer (Level 1)</option>
              <option value="OPERATOR">Operator (Level 2)</option>
              <option value="MANAGER">Manager (Level 3)</option>
              <option value="ADMIN">Administrator (Level 4)</option>
            </select>
          </div>
          <div><label for="target-decision">Decision</label><select id="target-decision"><option value="approved">Approve</option><option value="rejected">Reject</option><option value="revoked">Revoke</option></select></div>
<div><label for="target-reason">Reason for change</label><input id="target-reason" required minlength="5" maxlength="500"></div>
<button type="submit" style="background-color: #4f46e5;">Save access</button>
        </form>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
          <div>
            <h3>Accounts with Roles</h3>
            <table style="font-size: 0.8rem;">
              <thead><tr><th>Account</th><th>Role</th><th>Action</th></tr></thead>
              <tbody id="accounts-tbody"></tbody>
            </table>
          </div>
          <div>
            <h3>Role History</h3>
            <table style="font-size: 0.8rem;">
              <thead><tr><th>Account</th><th>Action</th><th>Date</th></tr></thead>
              <tbody id="history-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Dashboard Cards -->
      <div class="dashboard-grid">
        <div class="card"><h3>Total Items</h3><p id="total-items-count">0</p></div>
        <div class="card"><h3>Recent Movements</h3><p id="total-movements-count">0</p></div>
      </div>

      <!-- Forms Section (Hidden for Level 1 Viewers) -->
      <div id="forms-container" class="forms-container hidden">
        <div class="card">
          <h2>Add New Item</h2>
          <form id="item-form">
            <label for="item-name">Item Name:</label>
            <input type="text" id="item-name" maxlength="200" required />
            <button type="submit">Add Item</button>
          </form>
        </div>
        <div class="card">
          <h2>Record Movement</h2>
          <form id="movement-form">
            <label for="movement-item">Select Item:</label>
            <select id="movement-item" required></select>
            <label for="movement-type">Movement Type:</label>
            <select id="movement-type" required>
              <option value="IN">IN</option>
              <option value="OUT">OUT</option>
            </select>
            <label for="movement-quantity">Quantity:</label>
            <input type="number" id="movement-quantity" max="2147483647" step="1" min="1" value="1" required />
            <button type="submit">Save Movement</button>
          </form>
        </div>
      </div>

      <!-- Data Tables -->
      <div class="card">
        <h2>Current Stock Balance</h2>
        <table>
          <thead><tr><th>Item Name</th><th>Current Stock</th></tr></thead>
          <tbody id="stock-tbody"></tbody>
        </table>
      </div>
      <div class="card">
        <h2>Recent Movements History</h2><p>Showing up to 500 recent movements.</p>
        <table>
          <thead><tr><th>Date</th><th>Item</th><th>Type</th><th>Qty</th><th id="th-action">Action</th></tr></thead>
          <tbody id="movement-tbody"></tbody>
        </table>
      </div>
    </div></template></body></html>
